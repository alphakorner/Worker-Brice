<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg0:#070605;--bg1:#0C0A08;--bg2:#100D0A;--card:#0B0907;--card2:#14100B;
  --line:rgba(255,255,255,.07);--line2:rgba(255,150,60,.16);
  --tx:#FFFFFF;--tx2:#CFC8C0;--tx3:#8E847A;
  --acc:#FF6A1A;--acc2:#FF9D44;--accD:#E85608;
  --grad:linear-gradient(135deg,#FF6A1A 0%,#FF9D44 100%);
  --gradV:linear-gradient(180deg,#FFB870 0%,#FF6A1A 100%);
  --ok:#5BD46A;--warn:#FFC53D;--bad:#FF5C5C;--blue:#5BA0FF;--violet:#B779FF;--teal:#3DD6C0;
  --r:20px;--rs:15px;--rx:26px;
  --sh:0 16px 44px rgba(0,0,0,.62);--shA:0 6px 26px rgba(255,106,26,.5);
  --tr:.42s cubic-bezier(.34,1.4,.4,1);--trf:.28s cubic-bezier(.3,.9,.3,1);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg0);color:var(--tx);min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-2px;z-index:-2;background:var(--bg0);background-image:radial-gradient(1100px 620px at 85% -8%,rgba(255,106,26,.07),transparent 60%),radial-gradient(900px 700px at -10% 112%,rgba(255,157,68,.045),transparent 55%)}
::selection{background:rgba(255,106,26,.35)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#3C332B;border-radius:8px;border:2px solid var(--bg0)}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--acc2);text-decoration:none}
h1,h2,h3,.num{font-family:'Sora',sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.kbd{background:rgba(0,0,0,.3);padding:3px 9px;border-radius:8px;font-size:12px;border:1px solid var(--line2);font-family:'Sora'}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes popIn{0%{opacity:0;transform:scale(.8)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes floatA{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(28px,-22px,0) scale(1.1)}}
@keyframes floatB{0%,100%{transform:translate3d(0,0,0) scale(1.06)}50%{transform:translate3d(-24px,18px,0) scale(.95)}}
@keyframes orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes orbitR{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes shimmer{0%{background-position:-460px 0}100%{background-position:460px 0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,106,26,.45)}100%{box-shadow:0 0 0 16px rgba(255,106,26,0)}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dotTy{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes nowPulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin360{to{transform:rotate(360deg)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.06ms!important}}
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 70% 18%,#13100C,#070605 72%);overflow:hidden;transition:opacity .6s ease,transform .6s ease}
#gate.out{opacity:0;transform:scale(1.06);pointer-events:none}

.orb1{width:420px;height:420px;background:radial-gradient(circle,#FF6A1A,transparent 65%);top:-110px;right:-80px;animation:floatA 13s ease-in-out infinite}
.orb2{width:360px;height:360px;background:radial-gradient(circle,#8A5A38,transparent 65%);bottom:-120px;left:-90px;animation:floatB 16s ease-in-out infinite}
.gate-card{position:relative;z-index:2;width:min(430px,92vw);text-align:center;padding:44px 32px 34px;background:rgba(14,11,8,.66);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line2);border-radius:var(--rx);box-shadow:var(--sh);animation:scaleIn .7s var(--tr) both}
.logo-wrap{position:relative;width:106px;height:106px;margin:0 auto 16px}

.logo-ring2{position:absolute;inset:12px;border-radius:50%;border:1px solid rgba(255,255,255,.09);animation:orbitR 26s linear infinite}
.logo-ring2::after{content:"";position:absolute;bottom:-3px;left:18%;width:5px;height:5px;border-radius:50%;background:#FF9D44}
.logo-core{position:absolute;inset:23px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:var(--shA);animation:pulseRing 2.6s ease-out infinite}
.logo-core svg{width:31px;height:31px}
.gate-title{font-size:29px;font-weight:800;letter-spacing:3px}
.gate-title em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-sub{color:var(--tx2);font-size:13px;margin-top:4px}
.badge-cert{display:inline-flex;align-items:center;gap:8px;margin:16px auto 4px;padding:8px 16px;border-radius:99px;background:rgba(255,106,26,.1);border:1px solid rgba(255,106,26,.35);font-size:11.5px;font-weight:700;letter-spacing:.5px;color:var(--acc2);text-transform:uppercase;animation:fadeUp .8s .25s var(--tr) both}
.badge-cert svg{width:15px;height:15px;flex:none}
.badge-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;animation:fadeUp .8s .35s var(--tr) both}
.chip-soft{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11px;color:var(--tx2);font-weight:600}
.pin-row{display:flex;justify-content:center;gap:8px;margin:24px 0 8px;animation:fadeUp .8s .45s var(--tr) both;flex-wrap:wrap}
.pin{width:42px;height:52px;border-radius:13px;background:rgba(0,0,0,.28);border:1.5px solid var(--line2);text-align:center;font-size:20px;font-weight:700;font-family:'Sora';outline:none;transition:var(--trf);color:var(--tx)}
.pin:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,106,26,.18);transform:translateY(-3px)}
.pin.ok{border-color:var(--ok);background:rgba(132,199,136,.1)}
.gate-card.err .pin{border-color:var(--bad);background:rgba(233,112,112,.1)}
.gate-card.err{animation:shake .45s ease}
.gate-hint{font-size:12px;color:var(--tx3);min-height:18px}
.gate-foot{margin-top:22px;font-size:11px;color:var(--tx3);letter-spacing:.4px;animation:fadeUp .8s .6s var(--tr) both}
#app{display:none;min-height:100vh}
#app.on{display:block;animation:fadeIn .5s ease}
.main{min-width:0;max-width:1180px;margin:0 auto;padding:22px clamp(16px,3.4vw,34px) 128px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:24px;animation:fadeUp .5s var(--tr) both}
.tb-logo{width:44px;height:44px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,106,26,.55);flex:none;overflow:hidden}
.tb-logo .tb-spark{width:30px;height:30px;transform-origin:50% 50%;animation:logoSpin 4s cubic-bezier(.5,0,.2,1) infinite}
.tb-rays{transform-box:fill-box;transform-origin:center;animation:rayPulse 1.6s ease-in-out infinite}
.tb-core{transform-box:fill-box;transform-origin:center;animation:corePulse 1.6s ease-in-out infinite}
@keyframes logoSpin{0%{transform:rotate(0)}62.5%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
@keyframes rayPulse{0%,100%{transform:scale(.88)}50%{transform:scale(1.08)}}
@keyframes corePulse{0%,100%{transform:scale(.82)}50%{transform:scale(1.06)}}
.topbar h1{font-size:clamp(20px,2.5vw,26px);font-weight:800;line-height:1.1}
.topbar h1 small{display:block;font-size:12px;color:var(--tx3);font-weight:500;font-family:'Inter';margin-top:1px}
.tb-spacer{flex:1}
.search{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;min-width:min(230px,28vw);transition:var(--trf)}
.search:focus-within{border-color:rgba(255,106,26,.55);box-shadow:0 0 0 4px rgba(255,106,26,.12)}
.search input{background:none;border:none;outline:none;width:100%;font-size:13.5px}
.search input::placeholder{color:var(--tx3)}
.search svg{width:16px;height:16px;stroke:var(--tx3);flex:none}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:var(--trf);position:relative;flex:none}
.icon-btn svg{width:18px;height:18px;stroke:var(--tx2)}
.icon-btn:hover{background:var(--card2);transform:translateY(-2px);border-color:var(--line2)}
.icon-btn:active{transform:scale(.92)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2.5px var(--bg2)}
.me{width:42px;height:42px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#2A1A0E;flex:none;box-shadow:var(--shA);font-family:'Sora';cursor:pointer;transition:var(--trf)}
.me:active{transform:scale(.92)}
.view{display:none}
.view.on{display:block}
.view.on>*{animation:fadeUp .55s var(--tr) both}
.view.on>*:nth-child(2){animation-delay:.06s}
.view.on>*:nth-child(3){animation-delay:.12s}
.view.on>*:nth-child(4){animation-delay:.18s}
.view.on>*:nth-child(5){animation-delay:.24s}
.view.on>*:nth-child(6){animation-delay:.3s}
.dock{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;z-index:120;display:flex;align-items:center;justify-content:space-between;padding:11px 22px;border-radius:30px;background:rgba(8,6,5,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 18px 48px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.045)}
.dock::before{content:"";position:absolute;inset:0;border-radius:30px;padding:1.4px;background:rgba(255,150,60,.18);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:0}
.dock-bd{position:absolute;inset:0;border-radius:30px;overflow:hidden;padding:1.5px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:1}
.dock-bd i{position:absolute;left:50%;top:50%;width:160%;aspect-ratio:1/1;transform:translate3d(-50%,-50%,0);background:conic-gradient(from 0deg,transparent 0 60%,var(--acc) 76%,var(--acc2) 88%,transparent 100%);animation:spin360 4.5s linear infinite;will-change:transform}
.dk-grp{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.dk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 3px;border-radius:15px;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.2px;transition:var(--trf);min-width:40px;position:relative;opacity:.6}
.dk.on{opacity:1}
.dk svg{width:20px;height:20px;stroke:currentColor;transition:var(--trf)}
.dk:hover{color:var(--tx2)}
.dk:active{transform:scale(.9)}
.dk.on{color:var(--acc2)}
.dk.on svg{transform:translateY(-2px);filter:drop-shadow(0 4px 9px rgba(255,106,26,.55))}
.dk.on::after{content:"";position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.dk-ai{position:absolute;left:50%;top:50%;width:62px;height:62px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%) translateY(-11px);box-shadow:0 12px 30px rgba(255,106,26,.6),0 0 0 6px rgba(255,106,26,.1);z-index:5;transition:var(--tr)}
.dk-ai::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,106,26,.4);animation:pulseRing 2.4s ease-out infinite}
.dk-ai svg{width:27px;height:27px;stroke:#1A0E03}
.dk-ai:active{transform:translate(-50%,-50%) translateY(-11px) scale(.93)}
.dk-ai.on{box-shadow:0 14px 34px rgba(255,106,26,.85),0 0 0 3px rgba(255,157,68,.3)}
.dk-ai.on svg{transform:scale(1.06)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:var(--tr)}
.card.hov{cursor:pointer}
.card.hov:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:var(--sh)}
.card.hov:active{transform:translateY(-1px) scale(.99)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-t{font-size:16.5px;font-weight:700;font-family:'Sora'}
.muted{color:var(--tx2);font-size:13px}
.tiny{color:var(--tx3);font-size:11.5px}
.link-btn{color:var(--acc2);font-size:13px;font-weight:600;transition:var(--trf)}
.link-btn:hover{filter:brightness(1.2)}.link-btn:active{transform:scale(.95)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:15px;font-weight:700;font-size:13.5px;transition:var(--tr);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.95)}
.btn-p{background:var(--grad);color:#2A1A0E;box-shadow:var(--shA)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,106,26,.45)}
.btn-g{background:var(--bg2);border:1px solid var(--line2);color:var(--tx)}
.btn-g:hover{background:var(--card2);transform:translateY(-2px)}

.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:12px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--tx2)}
.tag.acc{background:rgba(255,106,26,.13);border-color:rgba(255,106,26,.35);color:var(--acc2)}
.tag.ok{background:rgba(132,199,136,.12);border-color:rgba(132,199,136,.3);color:var(--ok)}
.tag.warn{background:rgba(241,196,91,.12);border-color:rgba(241,196,91,.3);color:var(--warn)}
.tag.bad{background:rgba(233,112,112,.12);border-color:rgba(233,112,112,.3);color:var(--bad)}
.tag.blue{background:rgba(132,172,224,.12);border-color:rgba(132,172,224,.3);color:var(--blue)}
.tag.violet{background:rgba(183,149,223,.12);border-color:rgba(183,149,223,.3);color:var(--violet)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;border:1.5px solid rgba(255,255,255,.12);font-family:'Sora';transition:var(--trf)}
.av.sm{width:34px;height:34px;font-size:12px}
.av.lg{width:62px;height:62px;font-size:21px}
.empty{text-align:center;padding:46px 20px;color:var(--tx3)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.85;animation:floatY 4s ease-in-out infinite}
.empty b{display:block;color:var(--tx2);font-size:14.5px;margin-bottom:4px}
input.field,select.field,textarea.field{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;outline:none;font-size:14px;transition:var(--trf);color:var(--tx)}
.field:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,106,26,.13)}

label.fl{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin:13px 0 6px;letter-spacing:.4px;text-transform:uppercase}

.switch{position:relative;width:46px;height:27px;border-radius:99px;background:var(--bg2);border:1px solid var(--line2);transition:var(--tr);flex:none;cursor:pointer}

.hello{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.12;margin-bottom:4px}
.hello .ghost{color:#5C5145;font-weight:700}
.stat .num{font-size:clamp(24px,2.6vw,31px);font-weight:800;letter-spacing:-.5px;color:var(--acc);text-shadow:0 0 18px rgba(255,106,26,.35)}
.stat .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.stat .ic svg{width:19px;height:19px}
.trend{font-size:11px;font-weight:700}
.chart{display:flex;align-items:flex-end;gap:clamp(8px,2vw,18px);height:160px;padding-top:14px}
.cbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;height:100%;justify-content:flex-end}

function pasteClip(){if(!navigator.clipboard||!navigator.clipboard.readText)return toast("Lecture du presse-papier non dispo — utilisez Ctrl+V","bad");
  navigator.clipboard.readText().then(t=>{if(t&&t.trim())processText(t);else toast("Presse-papier vide","inf")}).catch(()=>toast("Autorisez l'accès au presse-papier","bad"))}
function exportHub(){const blob=new Blob([JSON.stringify(S.items,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="alpha-desk-hub.json";a.click();toast("Hub exporté")}
function clearHub(){if(confirm("Vider tout le Hub ?")){S.items=[];save("items");R.hub();toast("Hub vidé","inf")}}
function processText(t){t=String(t).trim();if(!t)return;if(isURL(t)){addItem({type:"link",title:host(t),url:t,tags:[]});toast("Lien capturé → Hub")}else{addItem({type:"note",title:t.split("\n")[0].slice(0,46),body:t,tags:[]});toast("Texte capturé → Hub")}}
function handleFiles(files,txtFallback){
  if((!files||!files.length)&&txtFallback)return processText(txtFallback);
  [...files].forEach(f=>{
    if(f.type.startsWith("image/")){if(f.size>1500000)return toast(f.name+" : image > 1.5 Mo","bad");const r=new FileReader();r.onload=()=>addItem({type:"image",title:f.name,data:r.result,tags:[]});r.readAsDataURL(f)}
    else if(/\.(txt|md|csv|json|js|html|css|log|xml|yaml|yml)$/i.test(f.name)||f.type.startsWith("text/")){if(f.size>400000)return toast(f.name+" : trop lourd","bad");const r=new FileReader();r.onload=()=>addItem({type:"file",title:f.name,body:String(r.result).slice(0,9000),tags:[]});r.readAsText(f)}
    else addItem({type:"file",title:f.name,body:"Fichier "+(f.type||"binaire")+" · "+(f.size/1024).toFixed(1)+" Ko",tags:[]})});
  if(files&&files.length)toast(files.length+" fichier(s) ajouté(s)")}

const EVT=[["rdv","RDV client","255,106,26"],["projet","Projet / build","183,149,223"],["relance","Relance","241,196,91"],["perso","Perso","132,172,224"]];

R.plan=function(){
  const week=weekOf(selDate),tk=dKey(today()),sk=dKey(selDate);
  let dayEv=S.events.filter(e=>e.date===sk).sort((a,b)=>a.start-b.start);
  if(Q)dayEv=dayEv.filter(e=>(e.title+(e.note||"")).toLowerCase().includes(Q));

  '<div class="grid" style="grid-template-columns:1.5fr 1fr;margin-top:16px;align-items:start" id="planGrid">'+
    '<div class="timeline"><div class="between" style="padding:15px 18px;border-bottom:1px solid var(--line)"><b style="font-family:Sora">'+relD(sk)+' <span class="muted" style="font-weight:500;font-family:Inter">· '+dayEv.length+' RDV</span></b><span class="tiny">06h → 22h · cliquez un créneau</span></div>'+
      '<div style="height:560px;overflow-y:auto" id="tlWrap"><div class="tl-scroll" id="tl" style="height:'+((H1-H0)*60+OFF*2)+'px;background-position:0 '+OFF+'px">'+
        [...Array(H1-H0+1)].map((_,i)=>'<div class="tl-h" style="top:'+(i*60+OFF)+'px">'+pad(H0+i)+':00</div>').join("")+
        [...Array(H1-H0)].map((_,i)=>'<div class="tl-slot" style="top:'+(i*60+OFF)+'px" onclick="openEventForm({date:\''+sk+'\',start:'+(H0+i)*60+'})"></div>').join("")+
        (function(){let lastEnd=-1,depth=0;return dayEv.map(e=>{const top=Math.max(0,e.start-H0*60)+OFF,h=Math.max(28,e.end-e.start);depth=e.start<lastEnd?depth+1:0;lastEnd=Math.max(lastEnd,e.end);const c=evCol(e.type),cl=e.clientId&&S.clients.find(x=>x.id===e.clientId);
          return '<div class="ev" onclick="openEventForm(null,\''+e.id+'\')" style="top:'+top+'px;height:'+h+'px;margin-left:'+depth*16+'px;background:rgba('+c+',.16);border-color:rgba('+c+',.5)"><b>'+esc(e.title)+'</b><small>'+minToH(e.start)+'–'+minToH(e.end)+(cl?" · "+esc(cl.nom):"")+'</small></div>'}).join("")})()+
        (sk===tk?(function(){const m=new Date().getHours()*60+new Date().getMinutes();return m>=H0*60&&m<=H1*60?'<div class="now-line" style="top:'+(m-H0*60+OFF)+'px"></div>':""})():"")+'</div></div></div>'+
    '<div style="display:flex;flex-direction:column;gap:16px"><div class="card"><div class="between"><b style="font-family:Sora;font-size:14.5px">'+cap(M12[calMonth.getMonth()])+' '+calMonth.getFullYear()+'</b>'+

          (function(){const first=new Date(calMonth),off=(first.getDay()+6)%7,cells=[];first.setDate(1-off);for(let i=0;i<42;i++){const d=new Date(first);d.setDate(first.getDate()+i);const k=dKey(d);cells.push('<button class="mc-d '+(d.getMonth()!==calMonth.getMonth()?"out":"")+' '+(k===sk?"sel":"")+' '+(k===tk?"today":"")+'" onclick="selDate=fromKey(\''+k+'\');R.plan()">'+d.getDate()+(S.events.some(e=>e.date===k)?'<span class="d"></span>':"")+'</button>')}return cells.join("")})()+'</div></div>'+
      '<div class="card"><b style="font-family:Sora;font-size:14.5px">Types de RDV</b><div style="margin-top:11px;display:flex;flex-direction:column;gap:9px">'+
        EVT.map(t=>'<div class="row"><span style="width:11px;height:11px;border-radius:4px;background:rgb('+t[2]+')"></span><span style="font-size:13px;color:var(--tx2)">'+t[1]+'</span><span class="tiny" style="margin-left:auto">'+S.events.filter(e=>e.type===t[0]).length+'</span></div>').join("")+'</div></div></div></div>';
  if(window.innerWidth<860)$("#planGrid").style.gridTemplateColumns="1fr";
  if(sk===tk){const m=new Date().getHours()*60+new Date().getMinutes();const w=$("#tlWrap");if(w)w.scrollTop=Math.max(0,m-H0*60+OFF-140)}};

  S.links=[
    {id:uid(),label:"Strass&Go (live)",url:"https://alphakorner.github.io/Strass-Go/",emoji:"🚌",color:"#FF6A1A"},

/* ════════ BOOT ════════ */
function boot(){
  seed();buildDock();buildGate();
  $("#meAv").textContent=(S.user.name||"B")[0].toUpperCase();
  $("#meAv").onclick=()=>go("set");
  $("#searchIn").addEventListener("input",e=>{Q=e.target.value.trim().toLowerCase();if(["hub","crm","plan"].includes(VIEW)&&R[VIEW])R[VIEW]()});
  $("#bellBtn").onclick=()=>{const tk=dKey(today()),n=S.events.filter(e=>e.date===tk).length,rel=S.clients.filter(c=>["lead","prospect","devis"].includes(c.statut)).length;
    toast(n||rel?(n+" RDV aujourd'hui · "+rel+" clients à relancer"):"Aucun RDV aujourd'hui ☀️","inf")};
  document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(["hub","crm","plan"].includes(VIEW))$("#searchIn").focus();else go("crm")}});
  document.addEventListener("paste",e=>{if(!sessionStorage.getItem("ad_open"))return;const t=e.target;if(t&&(/INPUT|TEXTAREA/.test(t.tagName)||t.isContentEditable))return;
    const imgs=[...(e.clipboardData.files||[])].filter(f=>f.type.startsWith("image/"));if(imgs.length)handleFiles(imgs);else{const txt=e.clipboardData.getData("text");if(txt&&txt.trim())processText(txt)}
    if(VIEW!=="hub")toast("Capturé → Hub","inf",1800)});
  document.addEventListener("dragover",e=>e.preventDefault());
  document.addEventListener("drop",e=>{if(sessionStorage.getItem("ad_open")&&e.dataTransfer.files.length&&!e.target.closest("#dz")){e.preventDefault();handleFiles(e.dataTransfer.files)}});
  if(SB.cfg.on)sbEnsure().then(ok=>{if(ok)sbPull(true)});
  if(sessionStorage.getItem("ad_open")){$("#gate").style.display="none";$("#app").classList.add("on");go("dash")}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();

</script>
